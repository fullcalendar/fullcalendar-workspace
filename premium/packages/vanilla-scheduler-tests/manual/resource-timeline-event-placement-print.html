<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8' />
<title>Resource Timeline Event Placement and Print</title>

<link rel='stylesheet' href='../../../../standard/packages/vanilla/dist/skeleton.css' />
<link rel='stylesheet' href='../../../../standard/packages/vanilla/dist/themes/classic/theme.css' />
<link rel='stylesheet' href='../../../../standard/packages/vanilla/dist/themes/classic/palette.css' />

<script src='../../../../standard/packages/vanilla/dist/all/global.js'></script>
<script src='../../../../standard/packages/vanilla/dist/themes/classic/global.js'></script>
<script src='../../vanilla-scheduler/dist/all/global.js'></script>
<script>

  var eventMaxStack = 3;
  var varyingEventHeights = false;

  function buildResources() {
    var resources = [];

    for (var resourceIndex = 0; resourceIndex < 14; resourceIndex++) {
      resources.push({
        id: 'resource-' + resourceIndex,
        title: 'Resource ' + (resourceIndex + 1)
      });
    }

    return resources;
  }

  function buildEvents() {
    var events = [];

    for (var resourceIndex = 0; resourceIndex < 14; resourceIndex++) {
      for (var eventIndex = 0; eventIndex < 24; eventIndex++) {
        var start = new Date(2026, 7, 14, 6, 0);
        var end;

        start.setMinutes(start.getMinutes() + eventIndex % 10 * 35 + Math.floor(eventIndex / 10) * 10);
        end = new Date(start);
        end.setMinutes(end.getMinutes() + 240 + eventIndex % 4 * 30);
        events.push({
          id: resourceIndex + ':' + eventIndex,
          resourceId: 'resource-' + resourceIndex,
          title: 'Event ' + (resourceIndex + 1) + '.' + (eventIndex + 1),
          start: start,
          end: end,
          extraLineCount: 2 - eventIndex % 3
        });
      }
    }

    return events;
  }

  function renderEventContent(arg) {
    var contentEl = document.createElement('div');
    var extraLineCount = varyingEventHeights ? arg.event.extendedProps.extraLineCount : 0;

    contentEl.textContent = arg.event.title;
    for (var lineIndex = 0; lineIndex < extraLineCount; lineIndex++) {
      var detailEl = document.createElement('div');

      detailEl.className = 'event-detail';
      detailEl.textContent = 'Extra detail ' + (lineIndex + 1);
      contentEl.appendChild(detailEl);
    }

    return { domNodes: [contentEl] };
  }

  document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var eventMaxStackOutputEl = document.getElementById('max-stack-value');
    var varyingHeightsEl = document.getElementById('varying-heights');

    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialDate: '2026-08-14',
      initialView: 'resourceTimelineDay',
      height: 'auto',
      eventMaxStack: eventMaxStack,
      eventContent: renderEventContent,
      resourceAreaWidth: '20%',
      slotMinWidth: 60,
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: ''
      },
      resources: buildResources(),
      events: buildEvents()
    });

    function updateEventMaxStack(nextEventMaxStack) {
      eventMaxStack = Math.min(10, Math.max(0, nextEventMaxStack));
      eventMaxStackOutputEl.textContent = String(eventMaxStack);
      calendar.setOption('eventMaxStack', eventMaxStack);
    }

    document.getElementById('max-stack-down').addEventListener('click', function() {
      updateEventMaxStack(eventMaxStack - 1);
    });
    document.getElementById('max-stack-up').addEventListener('click', function() {
      updateEventMaxStack(eventMaxStack + 1);
    });
    varyingHeightsEl.addEventListener('change', function() {
      varyingEventHeights = varyingHeightsEl.checked;
      calendar.render();
    });

    calendar.render();
  });

</script>
<style>

  body {
    margin: 40px 10px;
    padding: 0;
    font-family: Arial, Helvetica Neue, Helvetica, sans-serif;
    font-size: 14px;
  }

  .controls,
  #calendar {
    max-width: 1600px;
    margin-left: auto;
    margin-right: auto;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .controls output {
    min-width: 2ch;
    text-align: center;
  }

  .controls label {
    margin-left: 12px;
  }

  .event-detail {
    font-size: 11px;
    line-height: 1.3;
  }

  @media print {
    body {
      margin: 0;
    }

    .controls {
      display: none;
    }

    #calendar {
      max-width: none;
    }
  }

</style>
</head>
<body>

  <div class='controls'>
    <span>Max stack</span>
    <button type='button' id='max-stack-down' aria-label='Decrease max stack'>−</button>
    <output id='max-stack-value'>3</output>
    <button type='button' id='max-stack-up' aria-label='Increase max stack'>+</button>
    <span>(0 shows none)</span>
    <label><input type='checkbox' id='varying-heights' /> Varying event heights</label>
  </div>
  <div id='calendar'></div>

</body>
</html>
