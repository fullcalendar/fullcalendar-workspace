<!DOCTYPE html>
<html data-bs-theme='light'>
<head>
<meta charset='utf-8' />

<link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css' />
<link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css' />
<link rel='stylesheet' href='../../../../standard/packages/vanilla/dist/skeleton.css' />
<link rel='stylesheet' href='../../../../standard/packages/bootstrap5/dist/theme.css' />

<script src='../../../../standard/packages/vanilla/dist/all/global.js'></script>
<script src='../../vanilla-scheduler/dist/all/global.js'></script>
<script src='../../../../standard/packages/bootstrap5/dist/global.js'></script>
<script>

  document.addEventListener('DOMContentLoaded', function() {
    var darkModeToggle = document.querySelector('#dark-mode-toggle input');
    var calendarEl = document.getElementById('calendar');

    darkModeToggle.addEventListener('change', function() {
      document.documentElement.setAttribute('data-bs-theme', this.checked ? 'dark' : 'light');
    });

    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialDate: '2020-09-07',
      initialView: 'resourceTimeGridDay',
      editable: true,
      selectable: true,
      nowIndicator: true,
      dayMaxEvents: true,
      headerToolbar: {
        left: 'prevYear,prev,next,nextYear today',
        center: 'title',
        right: 'resourceTimeGridDay,timeGridWeek'
      },
      resources: [
        { id: 'a', title: 'Room A' },
        { id: 'b', title: 'Room B', eventColor: 'green' },
        { id: 'c', title: 'Room C', eventColor: 'orange' },
        { id: 'd', title: 'Room D', eventColor: 'red' }
      ],
      events: [
        { id: '1', resourceId: 'a', start: '2020-09-06', end: '2020-09-08', title: 'event 1' },
        { id: '2', resourceId: 'a', start: '2020-09-07T09:00:00', end: '2020-09-07T14:00:00', title: 'event 2' },
        { id: '3', resourceId: 'b', start: '2020-09-07T12:00:00', end: '2020-09-08T06:00:00', title: 'event 3' },
        { id: '4', resourceId: 'c', start: '2020-09-07T07:30:00', end: '2020-09-07T09:30:00', title: 'event 4' },
        { id: '5', resourceId: 'd', start: '2020-09-07T10:00:00', end: '2020-09-07T15:00:00', title: 'event 5' }
      ]
    });

    calendar.render();
  });

</script>
<style>

  body {
    margin: 40px 10px;
  }

  #dark-mode-toggle {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #calendar {
    margin: 0 auto;
    max-width: 1200px;
  }

</style>
</head>
<body>

  <label id='dark-mode-toggle'>
    Dark mode
    <input type='checkbox' />
  </label>

  <div id='calendar'></div>

</body>
</html>
