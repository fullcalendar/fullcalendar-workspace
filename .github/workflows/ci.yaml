name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  TZ: "America/New_York"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup PNPM
        uses: pnpm/action-setup@v2.4.1
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      # - name: Setup Turbo Cache
      #   uses: actions/cache@v3
      #   with:
      #     path: node_modules/.cache/turbo
      #     key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
      #     restore-keys: turbo-${{ github.job }}-${{ github.ref_name }}-

      - name: Install Dependencies
        run: |
          pnpm \
            --filter '!./examples/**' \
            --filter '!@fullcalendar/angular' \
            install

      - name: Lint
        # DISABLED!
        if: false
        run: |
          pnpm \
            --filter '!./examples/**' \
            --filter '!@fullcalendar/angular' \
            --filter '!@fullcalendar-tests/*' \
            run lint

      - name: Build
        run: |
          pnpm \
            --filter '!./examples/**' \
            --filter '!@fullcalendar/angular' \
            --filter '!@fullcalendar-tests/*' \
            run build

      # execute only connector-package tests, as "smoke" tests. they're fast
      # Vue disabled for now. giving playwright errors:
      #   --filter '@fullcalendar/vue3' \
      - name: Test connectors
        run: |
          pnpm \
            --filter '@fullcalendar/react' \
            run test

      # Vitest strips types without checking them. Needs the build above (tsconfig references)
      - name: Typecheck tests
        run: |
          pnpm \
            --filter '@fullcalendar-tests/*' \
            run typecheck

      # The test packages' suites, which run against the built packages above.
      - name: Install Playwright Chromium
        run: |
          pnpm \
            --filter '@fullcalendar-tests/standard' \
            exec playwright install --with-deps chromium

      - name: Test
        run: |
          pnpm \
            --filter '@fullcalendar-tests/*' \
            --workspace-concurrency=1 \
            run test

      # Again, with the React-rendering builds swapped in (see vitest.config.base.ts)
      - name: Test with React
        env:
          FORCE_REACT: '1'
        run: |
          pnpm \
            --filter '@fullcalendar-tests/*' \
            --workspace-concurrency=1 \
            run test
